baseURL = "https://blog.minifish.org/"
copyright = "© Mini Fish 2014-present. Licensed under CC-BY-NC"
languageCode = "en-US"
title = "Mini Fish"
theme = "PaperMod"
enableRobotsTXT = true
enableEmoji = true
#summaryLength = 0 # show summary by default length
#hasCJKLanguage = false

[menus]
  [[menus.main]]
    name = "Engineering"
    identifier = "/categories/engineering/"
    url = "/categories/engineering/"
    weight = 10
  [[menus.main]]
    name = "Archive"
    identifier = "/archives/"
    url = "/archives/"
    weight = 60
  [[menus.main]]
    name = "Search"
    identifier = "/search/"
    url = "/search/"
    weight = 70

[minify]
  disableXML = true
  minifyOutput = true

[params]
  env = "production"
  defaultTheme = "auto"
  description = "Notes on distributed systems, databases, reliable agent runtimes, and AI infrastructure by TiDB maintainer Jack Yu."
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  comments = true
  hidemeta = false
  hideSummary = false
  ShowPageNums = true
  showtoc = true
  tocopen = false
  ShowFullTextinRSS = true
  author = "Jack Yu"
  images = ["/android-chrome-512x512.png"]

  [params.homeInfoParams]
    Title = "Reliable systems for data and AI"
    Content = """
I’m Jack, a [TiDB maintainer](https://github.com/pingcap/community/blob/master/teams/tidb/membership.json) and distributed systems engineer. I write about transaction correctness, storage, agent runtimes, and AI infrastructure.

**Selected paths:** [Distributed systems](/systems/#distributed-systems) · [Agent systems](/systems/#agent-systems) · [Inference systems](/systems/#inference-systems)

**Featured:** [Reading TiDB source code](/posts/how-to-read-tidb-source-code-part-1/) · [Designing agentd](/posts/agentd-transport-neutral-runtime/) · [OceanBase internals](/posts/oceanbase-internals-transaction-replay-sql-unit-placement/)

[Explore selected systems work →](/systems/)
"""

  [[params.socialIcons]]
    name = "x"
    url = "https://x.com/jackysp"
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/jackysp"
  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/shuaipeng-yu-81280434/"
  [[params.socialIcons]]
    name = "email"
    url = "mailto:i@minifish.org"

  [params.editPost]
    URL = "https://github.com/jackysp/blog/tree/master/content"
    Text = "Suggest Changes" # edit text
    appendFilePath = true # to append file path to Edit link

[services]
  [services.disqus]
    shortname = "jackysp"
  [services.googleAnalytics]
    id = "G-G0H8JF722Y"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[assets]
  favicon = "/favicon.ico"
  favicon16x16 = "/favicon-16x16.png"
  favicon32x32 = "/favicon-32x32.png"
  apple_touch_icon = "/apple-touch-icon.png"
  safari_pinned_tab = "/favicon.svg"
